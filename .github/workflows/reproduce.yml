name: reproducibility-check

# Runs the README instructions in a clean Ubuntu machine on every push and on demand.
on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  paper-tables:
    name: Rebuild paper tables and figures (no GPU, no weights)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: pip install numpy==2.1.3 pandas==2.2.3 matplotlib==3.10.1 tabulate==0.9.0
      - run: python scripts/reproduce_paper_tables.py
      - run: python assignment_4/code/verify_tables.py

  pipeline:
    name: Install pinned requirements, smoke test, data preparation, M0 seed 42 on CPU
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install (CPU build of the pinned torch)
        run: |
          pip install torch==2.11.0 --index-url https://download.pytorch.org/whl/cpu
          pip install -r requirements.txt
          pip freeze | grep -iE "^(torch|transformers|huggingface|numpy|pandas|scikit|matplotlib)"
      - name: Offline smoke test (random weights, synthetic data)
        run: python scripts/smoke_test.py
      - name: Rebuild the frozen split from the raw dataset
        run: python scripts/build_splits.py
      - name: Prepare tokens for train / validation / test
        run: python scripts/prepare_data.py
      - name: Train M0 (selected lr 1e-4, seed 42) on CPU
        run: python scripts/train.py --model M0 --lr 1e-4 --seed 42 --device cpu
      - name: Compare with the published validation score
        run: |
          python - <<'EOF'
          import json, pandas as pd
          got = json.load(open("runs/M0_s42_lr0.0001/info.json"))["best"]
          paper = pd.read_csv("assignment_3/item3_evidence/reports/validation/per_seed.csv")
          ref = paper[(paper.model == "M0") & (paper.seed == 42)].iloc[0]
          print(f"M0 seed 42 validation macro-F1: reproduced on CPU {got['macro_f1']:.2f} | paper (T4 GPU) {ref.macro_f1:.2f}")
          print(f"M0 seed 42 validation accuracy: reproduced on CPU {got['accuracy']:.2f} | paper (T4 GPU) {ref.accuracy:.2f}")
          EOF
      - name: 512-token path (Senior Project II) works and keeps the 256 results separate
        env: { HIREMIND_MAX_LEN: "512" }
        run: |
          python scripts/prepare_data.py --no-test
          python scripts/train.py --model M0 --lr 1e-4 --seed 42 --max-updates 20 --device cpu
          python - <<'EOF'
          import torch
          t = torch.load("data/cache_L512/train_tokens.pt", weights_only=True)
          assert t["input_ids"].shape[1] == 512, t["input_ids"].shape
          import os; assert os.path.exists("runs_L512/M0_s42_lr0.0001/weights.pt")
          assert os.path.exists("runs/M0_s42_lr0.0001/weights.pt")   # the 256 run is untouched
          print("512 path OK:", tuple(t["input_ids"].shape))
          EOF
